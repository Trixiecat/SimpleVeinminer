plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
    // Loom adds the Minecraft and Fabric repositories automatically.
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "simpleveinminer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu (optional at runtime, only needed to compile the integration)
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def props = [
            'id'               : project.mod_id,
            'name'             : project.mod_name,
            'version'          : project.version,
            'loader_version'   : project.loader_version,
            'minecraft_version': project.accepted_versions
    ]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def archivesName = base.archivesName.get()
    inputs.property "archivesName", archivesName

    from("LICENSE") {
        rename { "${it}_${archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
